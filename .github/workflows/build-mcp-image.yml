# Builds the combined FalkorDB + Graphiti MCP server image (with the proxy_shim
# fix) and pushes it to ghcr.io/bradykirk/graphiti-mcp.
#
# Coolify pulls the :proxy-fix tag, so that tag is always updated. The image is
# also tagged with the MCP server version, the graphiti-core version, and latest.
#
# Triggers: push to main that touches mcp_server/, or a manual run.
name: Build MCP Image

on:
  push:
    branches: [main]
    paths:
      - 'mcp_server/**'
      - '.github/workflows/build-mcp-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradykirk/graphiti-mcp
  GRAPHITI_CORE_VERSION: '0.29.2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          MCP_VERSION=$(grep '^version = ' mcp_server/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "mcp_version=${MCP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker tags
        id: tags
        run: |
          MCP_VERSION="${{ steps.meta.outputs.mcp_version }}"
          GRAPHITI_VERSION="${{ env.GRAPHITI_CORE_VERSION }}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          TAGS="${IMG}:proxy-fix"
          TAGS="${TAGS},${IMG}:latest"
          TAGS="${TAGS},${IMG}:${MCP_VERSION}"
          TAGS="${TAGS},${IMG}:${MCP_VERSION}-graphiti-${GRAPHITI_VERSION}"
          TAGS="${TAGS},${IMG}:sha-${{ steps.meta.outputs.vcs_ref }}"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Docker tags:"; echo "${TAGS}" | tr ',' '\n'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp_server
          file: ./mcp_server/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            MCP_SERVER_VERSION=${{ steps.meta.outputs.mcp_version }}
            GRAPHITI_CORE_VERSION=${{ env.GRAPHITI_CORE_VERSION }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## MCP Image Build"
            echo ""
            echo "**MCP Server Version:** ${{ steps.meta.outputs.mcp_version }}"
            echo "**Graphiti Core Version:** ${{ env.GRAPHITI_CORE_VERSION }}"
            echo "**Commit:** ${{ steps.meta.outputs.vcs_ref }}"
            echo ""
            echo "### Tags"
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
